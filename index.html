<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高機能テキストカウンター & 整形ツール</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#121212',
                        darkcard: '#1e1e1e',
                        darkborder: '#2e2e2e'
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-darkbg text-gray-100 min-h-screen font-sans flex flex-col dark">

    <!-- ヘッダー -->
    <header class="border-b border-darkborder bg-darkcard px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
            <i class="fa-solid me-2 fa-calculator text-blue-500"></i>テキストカウンター
        </h1>
        <div class="flex items-center gap-3">
            <a id="githubLink" href="https://github.com/SU-tr4/TR-TextCounter" target="_blank" rel="noopener noreferrer" class="p-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300 transition-colors" title="GitHubリポジトリ">
                <i class="fa-brands fa-github"></i>
            </a>
            <button id="themeToggleBtn" class="p-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300 transition-colors" title="テーマ切り替え">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
            </button>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">

        <!-- 左側：エディタ領域 (3カラム) -->
        <div class="lg:col-span-3 flex flex-col gap-4">
            
            <!-- ツールバー -->
            <div class="bg-darkcard p-3 rounded-lg border border-darkborder flex flex-wrap gap-2 items-center justify-between">
                <div class="flex flex-wrap gap-2">
                    <button id="cleanWhitespaceBtn" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-xs md:text-sm rounded border border-darkborder transition-colors">
                        <i class="fa-solid fa-broom me-1"></i>空行・連続スペース削除
                    </button>
                    <button id="removeNewlinesBtn" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-xs md:text-sm rounded border border-darkborder transition-colors">
                        <i class="fa-solid fa-align-left me-1"></i>改行の一括削除
                    </button>
                    <button id="zenToHanBtn" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-xs md:text-sm rounded border border-darkborder transition-colors">
                        全角英数→半角
                    </button>
                </div>
                <div class="flex items-center gap-2">
                    <button id="copyBtn" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs md:text-sm rounded font-medium transition-colors">
                        <i class="fa-solid fa-copy me-1"></i>コピー
                    </button>
                    <button id="clearBtn" class="px-3 py-1.5 bg-red-600/80 hover:bg-red-600 text-white text-xs md:text-sm rounded font-medium transition-colors">
                        <i class="fa-solid fa-trash me-1"></i>クリア
                    </button>
                </div>
            </div>

            <!-- テキスト入力エリア -->
            <div class="relative flex-1 min-h-[400px]">
                <textarea id="inputText" class="w-full h-full p-4 bg-darkcard text-gray-100 rounded-lg border border-darkborder focus:outline-none focus:border-blue-500 font-mono resize-y min-h-[400px] leading-relaxed" placeholder="ここにテキストを入力または貼り付けしてください..."></textarea>
            </div>

            <!-- 下部情報バー -->
            <div class="flex justify-between items-center text-xs text-gray-400">
                <span id="saveStatus">自動保存: 有効</span>
                <button id="exportCsvBtn" class="hover:text-gray-200 underline">
                    <i class="fa-solid fa-file-csv me-1"></i>カウント結果をCSV出力
                </button>
            </div>
        </div>

        <!-- 右側：解析情報パネル (1カラム) -->
        <div class="flex flex-col gap-4">
            
            <!-- カウントカード一覧 -->
            <div class="bg-darkcard p-5 rounded-lg border border-darkborder flex flex-col gap-4">
                <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider border-b border-darkborder pb-2">
                    基本統計
                </h2>

                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-gray-900/50 p-3 rounded border border-darkborder">
                        <div class="text-xs text-gray-400">総文字数 (スペース込)</div>
                        <div class="text-2xl font-bold text-blue-400 mt-1" id="countTotal">0</div>
                    </div>
                    <div class="bg-gray-900/50 p-3 rounded border border-darkborder">
                        <div class="text-xs text-gray-400">文字数 (スペース除外)</div>
                        <div class="text-2xl font-bold text-green-400 mt-1" id="countNoSpace">0</div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-gray-900/50 p-3 rounded border border-darkborder">
                        <div class="text-xs text-gray-400">行数</div>
                        <div class="text-xl font-bold text-gray-200 mt-1" id="countLines">0</div>
                    </div>
                    <div class="bg-gray-900/50 p-3 rounded border border-darkborder">
                        <div class="text-xs text-gray-400">単語数</div>
                        <div class="text-xl font-bold text-gray-200 mt-1" id="countWords">0</div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-gray-900/50 p-3 rounded border border-darkborder">
                        <div class="text-xs text-gray-400">原稿用紙 (400字)</div>
                        <div class="text-xl font-bold text-purple-400 mt-1" id="countManuscript">0 枚</div>
                    </div>
                    <div class="bg-gray-900/50 p-3 rounded border border-darkborder">
                        <div class="text-xs text-gray-400">推定読了時間</div>
                        <div class="text-xl font-bold text-yellow-400 mt-1" id="readTime">0 分</div>
                    </div>
                </div>
            </div>

            <!-- SNS・プラットフォーム上限目安 -->
            <div class="bg-darkcard p-5 rounded-lg border border-darkborder flex flex-col gap-3">
                <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider border-b border-darkborder pb-2">
                    投稿制限チェック
                </h2>

                <div>
                    <div class="flex justify-between text-xs mb-1">
                        <span class="text-gray-300">X (旧Twitter) 全角140字</span>
                        <span id="xStatus" class="font-mono text-gray-400">0 / 140</span>
                    </div>
                    <div class="w-full bg-gray-800 rounded-full h-2 overflow-hidden">
                        <div id="xBar" class="bg-blue-500 h-2 transition-all duration-200" style="width: 0%"></div>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between text-xs mb-1">
                        <span class="text-gray-300">原稿用紙 1枚分 (400字)</span>
                        <span id="manuscriptStatus" class="font-mono text-gray-400">0 / 400</span>
                    </div>
                    <div class="w-full bg-gray-800 rounded-full h-2 overflow-hidden">
                        <div id="manuscriptBar" class="bg-purple-500 h-2 transition-all duration-200" style="width: 0%"></div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- 通知トースト -->
    <div id="toast" class="fixed bottom-5 right-5 bg-blue-600 text-white px-4 py-2 rounded shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none text-sm z-50">
        メッセージ
    </div>

    <script src="script.js"></script>
</body>
</html>
